server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # Συμπίεση για γρηγορότερη φόρτωση
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
 
    # Όλα τα routes (π.χ. /chat, /about) καταλήγουν στο index.html,
    # ώστε να λειτουργεί το Angular routing και το redirect του Microsoft login
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # Μακροχρόνιο cache για τα αρχεία με hash στο όνομα (JS, CSS, fonts, εικόνες)
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
 
    # Το index.html να μην γίνεται cache, ώστε να φορτώνεται πάντα η νέα έκδοση
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
 