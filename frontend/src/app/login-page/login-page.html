<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="brand-name">{{ brand }}</span>
      <img
        class="brand-logo"
        src="/skillakia-logo.png"
        alt="Skillakia logo: Got trained, hopefully will get hired"
        width="200"
        height="168"
      />
    </div>

    <h1>Καλώς ήρθατε</h1>
    <p class="subtitle">Συνδεθείτε με τον λογαριασμό σας για να συνεχίσετε.</p>

    <button
      type="button"
      class="login-btn"
      [disabled]="isRedirecting() || !isReady()"
      (click)="login()"
    >
      @if (isRedirecting()) {
        <span class="spinner"></span>
        Ανακατεύθυνση...
      } @else if (!isReady()) {
        <span class="spinner"></span>
        Προετοιμασία...
      } @else {
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Σύνδεση με Microsoft
      }
    </button>

    <p class="footnote">Θα μεταφερθείτε στη σελίδα σύνδεσης της Microsoft.</p>
  </div>
</div>
